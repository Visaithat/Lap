<!DOCTYPE html>
<html lang="lo" data-lang="lo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Board of Directors · LAP</title>
<link rel="icon" type="image/png" href="/public/img/lap-logo.png" />
<link rel="apple-touch-icon" href="/public/img/lap-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tw-config.js"></script>
<link rel="stylesheet" href="../assets/css/tokens.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  [data-person-modal]{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    background:rgba(15,23,42,0.55);padding:1rem;opacity:0;visibility:hidden;transition:opacity 200ms}
  [data-person-modal].is-open{opacity:1;visibility:visible}
  [data-person-modal] > .lap-modal{background:#fff;border-radius:24px;max-width:560px;width:100%;
    padding:2rem;box-shadow:0 20px 60px -10px rgba(2,144,218,0.3);transform:scale(0.96);transition:transform 200ms}
  [data-person-modal].is-open > .lap-modal{transform:scale(1)}
</style>
</head>
<body class="bg-lap-surface-50 text-lap-ink-900" data-depth="1">
<div data-partial="header"></div>

<main>
  <div class="lap-container pt-6 pb-2 text-sm text-lap-ink-600 flex items-center gap-2">
    <a href="../index.html" class="hover:text-lap-primary-700" data-lo="ໜ້າຫຼັກ" data-en="Home">ໜ້າຫຼັກ</a>
    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
    <span class="text-lap-ink-900" data-lo="ສະພາບໍລິຫານ" data-en="Board of Directors">ສະພາບໍລິຫານ</span>
  </div>

  <section class="py-10 md:py-16">
    <div class="lap-container max-w-3xl">
      <span class="lap-eyebrow" data-lo="ຜູ້ນຳ" data-en="Leadership">ຜູ້ນຳ</span>
      <h1 class="lap-h1 mt-4 mb-5" data-lo="ສະພາບໍລິຫານ" data-en="Board of Directors">ສະພາບໍລິຫານ</h1>
      <p class="text-lg text-lap-ink-600" data-lo="ສະພາບໍລິຫານຂອງ LAP ຮັບຜິດຊອບການກຳກັບ ແລະ ການກຳນົດທິດທາງຍຸດທະສາດໃນທຸກດ້ານ." data-en="The LAP board oversees governance and sets the strategic direction across all areas of the business.">ສະພາບໍລິຫານຂອງ LAP ຮັບຜິດຊອບການກຳກັບ ແລະ ການກຳນົດທິດທາງຍຸດທະສາດໃນທຸກດ້ານ.</p>
    </div>
  </section>

  <section class="pb-16">
    <div class="lap-container">
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <button data-person-card tabindex="0"
          data-name-lo="ທ່ານ ໄພງາມ ທຳມະນາມ" data-name-en="Mr. Phaingaek Tammanam"
          data-role-lo="ປະທານສະພາ" data-role-en="Chairman"
          data-bio-lo="ຜູ້ນຳອາວຸໂສດ້ານປະກັນໄພ ກວ່າ 25 ປີໃນຂະແໜງການເງິນຂອງ ສປປ ລາວ. [ປະຫວັດເພີ່ມຕ່ອມ — ຢືນຢັນກັບລູກຄ້າ]"
          data-bio-en="Senior insurance leader with 25+ years in the Lao financial sector. [more bio — confirm with client]"
          data-initials="ໄພ"
          class="lap-card lap-card-interactive p-6 text-left">
          <div class="aspect-square rounded-2xl lap-placeholder mb-5 !text-base">[portrait — ໄພງາມ]</div>
          <h3 class="lap-h3 mb-1" data-lo="ທ່ານ ໄພງາມ ທຳມະນາມ" data-en="Mr. Phaingaek Tammanam">ທ່ານ ໄພງາມ ທຳມະນາມ</h3>
          <span class="lap-pill" data-lo="ປະທານສະພາ" data-en="Chairman">ປະທານສະພາ</span>
        </button>

        <button data-person-card tabindex="0"
          data-name-lo="ທ່ານ ສົມມີໄຊ ວົງຄຳເສົາ" data-name-en="Mr. Sommisay Vongkhamsao"
          data-role-lo="ສະມາຊິກສະພາ" data-role-en="Board Member"
          data-bio-lo="ຜູ້ຊ່ຽວຊານດ້ານການເງິນ ແລະ ການກຳກັບເສດຖະກິດ. [ປະຫວັດເພີ່ມຕ່ອມ — ຢືນຢັນກັບລູກຄ້າ]"
          data-bio-en="Specialist in finance and economic regulation. [more bio — confirm with client]"
          data-initials="ສົມ"
          class="lap-card lap-card-interactive p-6 text-left">
          <div class="aspect-square rounded-2xl lap-placeholder mb-5 !text-base">[portrait — ສົມມີໄຊ]</div>
          <h3 class="lap-h3 mb-1" data-lo="ທ່ານ ສົມມີໄຊ ວົງຄຳເສົາ" data-en="Mr. Sommisay Vongkhamsao">ທ່ານ ສົມມີໄຊ ວົງຄຳເສົາ</h3>
          <span class="lap-pill" data-lo="ສະມາຊິກສະພາ" data-en="Board Member">ສະມາຊິກສະພາ</span>
        </button>

        <button data-person-card tabindex="0"
          data-name-lo="ນາງ ຕຸລາໂຟນ ສັນຕິສຸກ" data-name-en="Mrs. Toulaphone Santisouk"
          data-role-lo="ສະມາຊິກສະພາ" data-role-en="Board Member"
          data-bio-lo="ຜູ້ຊ່ຽວຊານດ້ານການກຳກັບອົງກອນ ແລະ ນະໂຍບາຍຄວາມສ່ຽງ. [ປະຫວັດເພີ່ມຕ່ອມ — ຢືນຢັນກັບລູກຄ້າ]"
          data-bio-en="Specialist in corporate governance and risk policy. [more bio — confirm with client]"
          data-initials="ຕຸ"
          class="lap-card lap-card-interactive p-6 text-left">
          <div class="aspect-square rounded-2xl lap-placeholder mb-5 !text-base">[portrait — ຕຸລາໂຟນ]</div>
          <h3 class="lap-h3 mb-1" data-lo="ນາງ ຕຸລາໂຟນ ສັນຕິສຸກ" data-en="Mrs. Toulaphone Santisouk">ນາງ ຕຸລາໂຟນ ສັນຕິສຸກ</h3>
          <span class="lap-pill" data-lo="ສະມາຊິກສະພາ" data-en="Board Member">ສະມາຊິກສະພາ</span>
        </button>
      </div>
    </div>
  </section>
</main>

<div data-person-modal aria-hidden="true" role="dialog">
  <div class="lap-modal">
    <div class="flex items-start justify-between gap-4 mb-5">
      <div class="flex items-center gap-4">
        <div data-modal-initials class="w-16 h-16 rounded-2xl bg-lap-primary-50 text-lap-primary-700 flex items-center justify-center font-bold text-2xl"></div>
        <div>
          <h2 data-modal-title class="lap-h3 mb-1"></h2>
          <span data-modal-role class="lap-pill"></span>
        </div>
      </div>
      <button data-modal-close class="w-9 h-9 rounded-full hover:bg-lap-surface-50 inline-flex items-center justify-center" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p data-modal-bio class="text-lap-ink-600 leading-relaxed"></p>
  </div>
</div>

<div data-partial="footer"></div>
<script src="../assets/js/partials.js"></script>
<script src="../assets/js/main.js" defer></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
